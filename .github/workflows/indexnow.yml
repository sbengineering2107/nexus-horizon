name: IndexNow

# Vercel reports each deployment to GitHub; when production goes live, ping IndexNow.
on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node apps/web/scripts/indexnow.mjs https://www.nexushorizonadvisors.com
